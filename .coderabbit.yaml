reviews:
  review_status: true
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: |
    이번 PR diff에 포함된 변경만 한국어로 요약한다.
    파일 이동이나 이름 변경을 신규 기능으로 설명하지 않는다.
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop
    ignore_title_keywords:
      - "WIP"
  path_filters:
    - "!pnpm-lock.yaml"
    - "!.agents/**"
    - "!.claude/**"
    - "!apps/web/public/mockServiceWorker.js"
    - "!packages/ui/tokens.json"
  path_instructions:
    - path: "apps/web/**"
      instructions: |
        Next.js 16 App Router 프로젝트. React 19, Tailwind v4 사용.
        - 페이지/레이아웃은 app/ 디렉터리 기반 파일 시스템 라우팅
        - 서버 컴포넌트 기본, 클라이언트 컴포넌트는 'use client' 명시
        - 데이터 패칭: Server Component fetch 또는 TanStack Query (클라이언트)
        - 폼: react-hook-form + zod
        - 구버전 패턴 주의: getServerSideProps/getStaticProps 없음, pages/ 없음
    - path: "apps/admin/**"
      instructions: |
        Next.js 16 App Router 기반 어드민 앱. 웹 전용이며 개발 서버는 3001 포트를 사용.
        - 서버 컴포넌트가 기본이며, 브라우저 API나 상태가 필요한 경우에만 'use client' 명시
        - 페이지와 레이아웃은 app/ 디렉터리 기반 파일 시스템 라우팅 사용
        - 구버전 패턴 주의: getServerSideProps/getStaticProps 없음, pages/ 없음
    - path: "apps/native/**"
      instructions: |
        Expo 57 / React Native 0.86 프로젝트. React 19, Expo managed workflow.
        - 네이티브 브릿지: @webview-bridge/react-native
        - 빌드: expo prebuild (ios/android 폴더는 gitignore)
        - 스타일: StyleSheet (Tailwind 없음)
        - 구버전 패턴 주의: expo-router 미사용, 클래스형 컴포넌트 없음
    - path: "packages/ui/**"
      instructions: |
        공유 UI 컴포넌트 라이브러리. Storybook 10, Tailwind v4, CVA 사용.
        - 컴포넌트는 stories 파일과 함께 관리
        - Chromatic 비주얼 테스트 연동

language: ko
tone_instructions: >
  자연스럽고 간결한 한국어로 작성한다. 번역투와 불필요한 영어 문단을 피하고,
  코드 식별자·파일명·설정값은 백틱으로 감싼다.
